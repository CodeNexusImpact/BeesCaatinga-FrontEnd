version: '3.8'

services:
  db:
    # Imagem oficial do PostgreSQL 18
    image: postgres:18

    # Nome do container para facilitar a identificação
    container_name: postgres18_db

    # Reinicia o container automaticamente a menos que seja parado manualmente
    restart: unless-stopped

    # Variáveis de ambiente ESSENCIAIS
    # Substitua pelos seus próprios valores
    environment:
      POSTGRES_USER: erick
      POSTGRES_PASSWORD: 12345678
      POSTGRES_DB: teste_db

    ports:
      # Mapeia a porta 5432 do container para a porta 5432 da sua máquina (host)
      # Formato: "HOST:CONTAINER"
      - "5432:5432"

    volumes:
      # ATENÇÃO: Mudança importante no Postgres 18!
      # O caminho do volume agora é /var/lib/postgresql
      # (Em versões anteriores, era /var/lib/postgresql/data)
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  beescaatinga:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SKIP_TESTS: "true"
    container_name: beescaatinga_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/teste_db
      SPRING_DATASOURCE_USERNAME: erick
      SPRING_DATASOURCE_PASSWORD: 12345678
      SPRING_PROFILES_ACTIVE: prod
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx512m"

# Define o volume nomeado para persistir os dados do banco
volumes:
  postgres_data:
    driver: local