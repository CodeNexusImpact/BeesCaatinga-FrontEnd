spring:
  application:
    name: BeesCaatinga
  datasource:
    url: jdbc:postgresql://localhost:5432/beescaatinga-db
    username: postgres
    password: '1234'
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
  flyway:
    enabled: true # rodar primeiro com false, depois deixa assim
    baseline-on-migrate: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate # rodar primeiro com create, depois deixa assim
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  mvc:
    format:
      date: dd/MM/yyyy
  jackson:
    date-format: dd/MM/yyyy
    time-zone: America/Sao_Paulo