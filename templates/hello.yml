name: 🚀 Executar HelloWorld

on:
  push:
    branches:
      - backend/erick
  workflow_dispatch:

jobs:
  build-and-run-hello:
    runs-on: ubuntu-latest

    steps:
      # 1. Baixa o seu código do repositório para a máquina virtual
      - name: ⬇️ Check-out do código
        uses: actions/checkout@v5

      # 2. Instala o Java (OpenJDK 21, igual ao que você estava usando no Docker)
      - name: ☕ Configurar JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin' # Uma distribuição popular do OpenJDK
      
      # 3. Compila e executa o seu arquivo
      - name: ⚙️ Compilar e Executar HelloWorld.java
        run: |
          # ----------------------------------------------------------------
          # IMPORTANTE: Navegamos até o diretório exato do arquivo
          # Seu arquivo está em: backend/src/main/java/io/sage/BeesCaatinga
          # ----------------------------------------------------------------
          cd backend/src/main/java/io/sage/BeesCaatinga
          
          echo "--- 1. Compilando o HelloWorld.java ---"
          javac HelloWorld.java
          
          echo "--- 2. Executando o HelloWorld.class ---"
          java HelloWorld