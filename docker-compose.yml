# Ambiente de DESENVOLVIMENTO local.
# Para homologação/produção use o stack integrado (beescaatinga-integrado).
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bees}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bees_dev}
      POSTGRES_DB: ${POSTGRES_DB:-beescaatinga}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/codenexusimpact/beescaatinga-backend:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-beescaatinga}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-bees}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-bees_dev}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx512m"

  frontend:
    build:
      context: ./mobile
      args:
        EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-http://localhost:8080}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8081}:8080"

volumes:
  postgres_data:
