name: Java CI com Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  tests:
    # O tipo de máquina virtual que o job irá rodar
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
    # 1. Faz o checkout do seu repositório para que o workflow possa acessá-lo
    - name: Checkout do repositório
      uses: actions/checkout@v4

    # 2. Configura o ambiente Java (JDK 21)
    - name: Configurar JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        # Habilita o cache de dependências do Maven para acelerar builds futuros
        cache: maven

    # 3. Sobe o serviço de banco de dados definido no docker-compose.yml
    # Apenas o serviço 'db' é iniciado, pois é o único necessário para os testes.
    - name: Iniciar serviços
      run: docker compose up -d db

    # 4. Aguarda o PostgreSQL estar completamente pronto para aceitar conexões
    # Isso evita que os testes comecem antes do banco estar disponível.
    - name: Aguardar o PostgreSQL
      run: |
        echo "Aguardando o PostgreSQL..."
        # O comando `docker compose ps -q db` retorna o ID do container do serviço 'db'
        # O `pg_isready` checa se o banco de dados 'teste_db' está pronto para aceitar conexões com o usuário 'erick'
        # O loop 'until' continua tentando a cada 2 segundos até o comando ser bem-sucedido.
        until docker exec $(docker compose ps -q db) pg_isready -U erick -d teste_db; do
          sleep 2
        done
        echo "PostgreSQL está pronto!"

    # 5. Executa os testes do Maven
    # O Spring Boot automaticamente usará as configurações do application.yml para se conectar ao banco de dados
    - name: Rodar os testes com Maven
      run: mvn test
