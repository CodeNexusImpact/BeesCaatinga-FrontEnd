name: Build e Push da Imagem Docker do Backend

on:
  push:
    branches: [ "main" ] # ou o nome do seu branch principal, ex: master

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend # Executa todos os comandos no diretório backend

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Buildar projeto Maven
        run: mvn clean install -DskipTests

      - name: Buildar e enviar imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: ./backend # O contexto para o Dockerfile é o diretório backend
          push: true
          tags: |
            SEU_USUARIO_DOCKER/beescaatinga-backend:latest
            SEU_USUARIO_DOCKER/beescaatinga-backend:${{ github.sha }}
