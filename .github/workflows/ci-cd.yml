name: CI/CD do Backend BeesCaatinga

on:
  push:
    branches: [ "backend/erick" ] # Ajuste para o seu branch principal, se diferente
  pull_request:
    branches: [ "backend/erick" ] # Ajuste para o seu branch principal, se diferente

jobs:
  tests:
    name: Executar Testes do Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend # Executa todos os comandos no diretório backend

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Iniciar serviços de teste (PostgreSQL)
        run: docker compose up -d db

      - name: Aguardar o PostgreSQL
        run: |
          echo "Aguardando o PostgreSQL..."
          until docker exec $(docker compose ps -q db) pg_isready -U erick -d teste_db; do
            sleep 2
          done
          echo "PostgreSQL está pronto!"

      - name: Rodar os testes com Maven
        run: mvn test

  build-and-push-image:
    name: Buildar e Enviar Imagem Docker
    needs: tests # Esta job SÓ roda se a job 'tests' for bem-sucedida
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend # Executa todos os comandos no diretório backend

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Buildar projeto Maven (sem testes, pois já rodaram)
        run: mvn clean install -DskipTests

      - name: Buildar e enviar imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: ./backend # O contexto para o Dockerfile é o diretório backend
          push: true
          tags: |
            erickwolf/beescaatinga-backend:latest
            erickwolf/beescaatinga-backend:${{ github.sha }}