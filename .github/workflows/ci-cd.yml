name: CI/CD BeesCaatinga

on:
  push:
    branches: [ "main", "backend/erick" ]
  pull_request:
    branches: [ "main", "backend/erick" ]

jobs:
  tests-backend:
    name: Executar Testes do Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          
      - name: Iniciar banco de dados para testes
        run: docker compose up -d db

      - name: Aguardar o PostgreSQL
        run: |
          echo "Aguardando o PostgreSQL..."
          until docker exec postgres_db pg_isready -U erick -d teste_db; do
            sleep 2
          done
          echo "PostgreSQL está pronto!"

      - name: Rodar os testes com Maven
        working-directory: ./backend
        run: ./mvnw test

  validate-docker-compose:
    name: Validar Docker Compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
      
      - name: Validar sintaxe do Docker Compose
        run: docker compose -f docker-compose.yml config

  build-and-push-images:
    name: Buildar e Enviar Imagens Docker
    needs: [tests-backend, validate-docker-compose]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/backend/erick')
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # Backend Build & Push
      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Buildar projeto Maven
        working-directory: ./backend
        run: ./mvnw clean install -DskipTests

      - name: Buildar e enviar imagem Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          build-args: SKIP_TESTS=true
          tags: |
            erickwolf/beescaatinga-backend:latest
            erickwolf/beescaatinga-backend:${{ github.sha }}

      # Frontend Build & Push
      - name: Buildar e enviar imagem Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./mobile
          push: true
          tags: |
            erickwolf/beescaatinga-frontend:latest
            erickwolf/beescaatinga-frontend:${{ github.sha }}
